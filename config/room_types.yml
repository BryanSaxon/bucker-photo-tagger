# The designer-facing room vocabulary.
#
# Deliberately NOT the NewStart room dictionary: that is 226 catalog codes
# scoped per community, which is the wrong vocabulary for someone looking at a
# photograph. This list is Signature's own language and keeps the distinctions
# they care about — master vs. secondary vs. powder — while dropping the codes.
#
# Seeded from here, then editable in the app (Room Types admin), so Signature
# can adjust without a deploy. Editing this file only affects a fresh seed.
- { key: master_bedroom,      name: "Master Bedroom",      sort_order: 10 }
- { key: master_bathroom,     name: "Master Bathroom",     sort_order: 20 }
